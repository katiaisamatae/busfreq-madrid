# Configuración del modelo LightGBM (baseline avanzado) — Módulo 1
# Uso: python demand/train.py --config configs/lgbm.yaml

experiment:
  name: demand_lgbm_baseline
  mlflow_tracking_uri: ./mlruns

data:
  processed_path: data/processed/features.parquet
  target: validations
  # Líneas piloto (se rellenan tras el EDA de la Fase 1)
  pilot_lines: []

split:
  # Validación walk-forward — NUNCA usar datos futuros en entrenamiento
  strategy: walk_forward
  n_folds: 4
  horizon_hours: 48
  test_period_months: 3

features:
  calendar: [hour, day_of_week, month, is_weekend]
  cyclical: [hour, day_of_week]      # codificación seno/coseno
  holidays: [is_national, is_regional, is_local]
  weather: [temp, precipitation, wind]
  events: [is_match_day, is_concert]
  lags: [1, 24, 48, 168]              # 1h, 1d, 2d, 1 semana (en horas)
  rolling_windows: [3, 24, 168]

model:
  objective: regression_l1           # optimiza MAE
  metric: mae
  n_estimators: 1000
  learning_rate: 0.05
  num_leaves: 31
  early_stopping_rounds: 50
  random_state: 42
